<!doctype html>

<head>

<title>Bluetooth Test Dashboard</title>
<style>
:root {

  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f0efec;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #6f6d68;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);

  }
}

  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #9a988f;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px 48px; }
header.top { padding: 20px 0 12px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
header.top h1 { font-size: 22px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
.sub { color: var(--ink-2); font-size: 13px; }
.meta-line { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--ink-2); font-size: 13px; margin-top: 4px; }
.meta-line b { color: var(--ink); font-weight: 600; }
button, select {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 12px; cursor: pointer;
}
button:hover, select:hover { background: var(--surface-2); }
nav.sections { position: sticky; top: 0; z-index: 5; background: var(--page); border-bottom: 1px solid var(--border);
  display: flex; gap: 4px; overflow-x: auto; padding: 8px 0; scrollbar-width: none; }
nav.sections a { text-decoration: none; color: var(--ink-2); padding: 4px 10px; border-radius: 999px; white-space: nowrap; font-size: 13px; }
nav.sections a:hover { background: var(--surface-2); color: var(--ink); }
section { margin-top: 28px; scroll-margin-top: 56px; }
section > h2 { font-size: 17px; margin: 0 0 4px; font-weight: 650; }
section > .lede { color: var(--ink-2); margin: 0 0 14px; font-size: 13px; max-width: 80ch; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
.card h3 { font-size: 14px; margin: 0 0 2px; font-weight: 600; }
.card .note { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
.grid { display: grid; gap: 12px; }
.g-tiles { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.g-2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); }
.g-3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.hero { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 12px; }
@media (max-width: 720px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.hero-fig { font-size: 64px; line-height: 1; font-weight: 650; letter-spacing: -0.02em; margin: 6px 0 8px; }
.hero-fig small { font-size: 20px; color: var(--ink-2); font-weight: 500; }
.tile .label { color: var(--ink-2); font-size: 12.5px; }
.tile .value { font-size: 26px; font-weight: 650; margin: 2px 0; letter-spacing: -0.01em; }
.tile .delta { font-size: 12.5px; color: var(--ink-2); }
.up-good { color: var(--good-text); } .down-bad { color: var(--bad-text); }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.badge .ic { width: 16px; height: 16px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10px; font-weight: 800; color: #fff; flex: none; }
.ic.good { background: var(--good); } .ic.warning { background: var(--warning); color: #0b0b0b; }
.ic.serious { background: var(--serious); color: #0b0b0b; } .ic.critical { background: var(--critical); }
.pill { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.p0 { background: var(--critical); color: #fff; } .pill.p1 { background: var(--serious); color: #0b0b0b; }
.summary-text { font-size: 15px; line-height: 1.6; margin: 0 0 10px; max-width: 90ch; }
ul.bullets { margin: 0; padding-left: 18px; } ul.bullets li { margin: 3px 0; }
.source { font-size: 12px; color: var(--muted); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { color: var(--ink-2); font-weight: 600; font-size: 12px; white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.table-scroll { overflow-x: auto; }
details.tv { margin-top: 8px; } details.tv summary { cursor: pointer; color: var(--ink-2); font-size: 12.5px; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); margin: 0 0 6px; }
.legend .key { display: inline-block; vertical-align: middle; margin-right: 6px; }
.legend .key.line { width: 14px; height: 2px; border-radius: 1px; }
.legend .key.rect { width: 10px; height: 10px; border-radius: 2px; }
.axis-text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.end-label { fill: var(--ink); font-size: 11.5px; font-weight: 600; }
.ref-label { fill: var(--muted); font-size: 11px; }
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); color: var(--ink);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  max-width: 280px; display: none; }
#tip .t { color: var(--ink-2); font-size: 11.5px; margin-bottom: 4px; }
#tip .row { display: flex; align-items: center; gap: 8px; }
#tip .row .k { width: 12px; height: 2px; border-radius: 1px; flex: none; }
#tip .row .v { font-weight: 650; font-variant-numeric: tabular-nums; }
#tip .row .n { color: var(--ink-2); }
.heat { border-collapse: separate; border-spacing: 2px; width: 100%; }
.heat th, .heat td { border: 0; padding: 0; }
.heat th.feat { width: 1%; text-align: left; font-weight: 500; color: var(--ink); font-size: 12.5px; padding-right: 10px; white-space: nowrap; }
.heat th.col { text-align: center; font-size: 11px; color: var(--muted); font-weight: 500; padding-bottom: 4px; }
.heat td.cell { min-width: 30px; height: 22px; border-radius: 4px; }
.heat tr.group th { padding: 10px 0 4px; font-size: 12px; color: var(--ink-2); font-weight: 600; text-align: left; }
.scale { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink-2); margin-top: 10px; align-items: center; }
.scale span.sw { display: inline-block; width: 18px; height: 12px; border-radius: 3px; margin-right: 4px; vertical-align: -2px; }
.anom { display: flex; flex-direction: column; gap: 6px; }
.anom .type { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
.action { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; padding: 12px 0; border-bottom: 1px solid var(--grid); }
.action:last-child { border-bottom: 0; }
.action .pill { align-self: start; }
.action .team { font-size: 12px; color: var(--ink-2); font-weight: 600; }
.action .what { font-size: 14px; }
.action .why { font-size: 12.5px; color: var(--ink-2); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; font-size: 13px; color: var(--ink-2); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--ink-2); } .kv dd { margin: 0; font-weight: 600; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.mono.id { white-space: nowrap; }
footer { margin-top: 36px; color: var(--muted); font-size: 12px; }
@media print { nav.sections, #theme { display: none; } .card { break-inside: avoid; } }
</style>
</head>

function niceTicks(min, max, count = 4) {

      const tx = s("text", { x: last[0] + 8, y: last[1] + 4, class: "end-label" }); tx.textContent = (o.fmt || fmt)(sr.values[n - 1]); svg.append(tx);
    });
    const cross = s("line", { y1: m.t, y2: H - m.b }, "stroke:var(--axis);stroke-width:1;display:none");
    const dots = o.series.map(sr => { const c = s("circle", { r: 4 }, `fill:${sr.color};stroke:var(--surface);stroke-width:2;display:none`); svg.append(c); return c; });
    svg.append(cross);

    svg.append(hit);

      showTip(cx, cy, o.tipTitle ? o.tipTitle(i) : o.labels[i], o.series.map(sr => ({ color: sr.color, value: (o.fmt || fmt)(sr.values[i]), label: sr.name })));
    };
    const hide = () => { cross.style.display = "none"; dots.forEach(d => d.style.display = "none"); hideTip(); };

      const b = svg.getBoundingClientRect(); show(i, b.left + X(i) * b.width / W, b.top + 20);
    });
    svg.addEventListener("focus", () => { const b = svg.getBoundingClientRect(); show(idx, b.left + X(idx) * b.width / W, b.top + 20); });
    svg.addEventListener("blur", hide);

  });
}

// Vertical columns, emphasis form: highlighted columns in the accent, the rest de-emphasised.
function columnChart(container, o) {

    const Y = v => m.t + (1 - v / y1) * (H - m.t - m.b);

    ticks.forEach(t => {
      svg.append(s("line", { x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t) }, `stroke:var(${t === 0 ? "--axis" : "--grid"});stroke-width:1`));
      const tx = s("text", { x: m.l - 6, y: Y(t) + 4, "text-anchor": "end", class: "axis-text" }); tx.textContent = compact(t); svg.append(tx);

      if (hi) { const tx = s("text", { x: x + bw / 2, y: Y(v) - 5, "text-anchor": "middle", class: "end-label" }); tx.textContent = fmt(v); svg.append(tx); }
      if (W >= 520 || i % 2 === 0) {

      }

// Horizontal bars; one or more stacked series with a 2px surface gap and a rounded data-end.
function hBars(container, o) {
  const legend = o.series.length > 1 ? h("div", { class: "legend" }, o.series.map(sr =>
    h("span", null, h("span", { class: "key rect", style: "background:" + sr.color }), sr.name))) : null;
  const holder = h("div", { class: "chart" }); container.append(legend || "", holder);
  mount(holder, W => {
    const row = 30, bh = 16, labelW = Math.min(o.labelWidth || 170, W * 0.42), m = { l: labelW, r: 46, t: 4, b: 4 };
    const H = m.t + m.b + row * o.rows.length;
    const max = Math.max(...o.rows.map(r => r.values.reduce((a, b) => a + b, 0)), 1);
    const Xw = v => v / max * (W - m.l - m.r);
    const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": o.aria });
    svg.append(s("line", { x1: m.l, x2: m.l, y1: m.t, y2: H - m.b }, "stroke:var(--axis);stroke-width:1"));
    o.rows.forEach((r, i) => {
      const y = m.t + i * row + (row - bh) / 2;
      const lb = s("text", { x: m.l - 8, y: y + bh / 2 + 4, "text-anchor": "end", class: "axis-text" }, "fill:var(--ink)");
      let label = r.label; const maxChars = Math.floor(labelW / 6.6);
      if (label.length > maxChars) label = label.slice(0, maxChars - 1) + "…";
      lb.textContent = label; svg.append(lb);
      let x = m.l; const total = r.values.reduce((a, b) => a + b, 0);
      const lastIdx = r.values.reduce((li, v, k) => v > 0 ? k : li, -1);
      r.values.forEach((v, k) => {
        if (v <= 0) return;
        const w = Math.max(Xw(v) - (k === lastIdx ? 0 : 2), 1);
        const col = r.colors ? r.colors[k] : o.series[k].color;
        svg.append(k === lastIdx ? s("path", { d: roundedRightBar(x, y, w, bh, 4) }, `fill:${col}`) : s("rect", { x, y, width: w, height: bh }, `fill:${col}`));
        x += Xw(v);
      });
      const tv = s("text", { x: m.l + Xw(total) + 6, y: y + bh / 2 + 4, class: "end-label" }); tv.textContent = (o.fmt || fmt)(total); svg.append(tv);
      const hit = s("rect", { x: 0, y: m.t + i * row, width: W, height: row, tabindex: 0, "aria-label": `${r.label}: ${total}` }, "fill:transparent");
      tipFor(hit, r.label, (o.tipRows ? o.tipRows(r, i) : r.values.map((v, k) => ({ color: o.series[k].color, value: fmt(v), label: o.series[k].name }))));
      svg.append(hit);
    });
    holder.append(svg);
  });
}

function sparkline(values, opts = {}) {
  const W = opts.w || 96, H = opts.h || 26, pad = 4;
  const all = values.concat(opts.ref != null ? [opts.ref] : []);
  const lo = Math.min(...all), hi = Math.max(...all), span = hi - lo || 1;
  const X = i => pad + i * (W - 2 * pad) / (values.length - 1), Y = v => H - pad - (v - lo) / span * (H - 2 * pad);
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, "aria-hidden": "true" });
  if (opts.ref != null) svg.append(s("line", { x1: pad, x2: W - pad, y1: Y(opts.ref), y2: Y(opts.ref) }, "stroke:var(--muted);stroke-width:1;stroke-dasharray:3 2"));
  svg.append(s("polyline", { points: values.map((v, i) => `${X(i)},${Y(v)}`).join(" ") }, "fill:none;stroke:var(--muted);stroke-width:1.5;stroke-linejoin:round"));
  const li = values.length - 1;
  svg.append(s("circle", { cx: X(li), cy: Y(values[li]), r: 3 }, "fill:var(--s1);stroke:var(--surface);stroke-width:1.5"));
  return svg;
}

function sparkColumns(values) {

  svg.append(s("line", { x1: 0, x2: W, y1: H - 0.5, y2: H - 0.5 }, "stroke:var(--axis);stroke-width:1"));
  return svg;
}

    highlight: duts.map((d, i) => out.has(d.dut_id) ? i : -1).filter(i => i >= 0),
    tipTitle: i => duts[i].dut_id, tipRows: i => [
      { value: fmt(duts[i].crashes_all_builds), label: "crashes, all builds" }, { value: fmt(duts[i].crashes_latest_build), label: "crashes, latest build" },
      { value: duts[i].board_rev, label: "board" }, { value: duts[i].rf_module_lot, label: "RF lot" }, { value: duts[i].bench, label: "bench" }] });
  dutCard.append(details("Table view", tableView(["DUT", "Board", "RF lot", "Bench", "All builds", "Latest"], duts.map(d => [d.dut_id, d.board_rev, d.rf_module_lot, d.bench, d.crashes_all_builds, d.crashes_latest_build]), [4, 5])));

  const kpi = card("KPI & performance", `${D.kpis.length} metrics, latest build; sparkline shows the build-by-build average against the target (dashed).`,
    tableView(["Metric", "Target", "Avg", "p95", "Change", "Status", "Trend", "Jira"], D.kpis.map(k => [
      k.metric_name, k.target, fmt(k.measured_avg, k.target_value < 10 ? 2 : 0), fmt(k.measured_p95, k.target_value < 10 ? 2 : 0),
      k.delta_vs_previous_build == null ? "n/a" : signed(k.delta_vs_previous_build, k.target_value < 10 ? 2 : 1),
      badge(k.status), sparkline(D.kpi_series[k.metric_name].avg, { ref: k.target_value }), k.linked_jira ? h("span", { class: "mono id", text: k.linked_jira }) : "—"]), [2, 3, 4]));
  return section("domains", "Test domains", "HCI regression (5,000 tests), phone interoperability (1,000), MTBF stress on 16 DUTs, and the KPI matrix.",
    heat, h("div", { class: "grid g-2", style: "margin-top:12px" }, top, dutCard), h("div", { style: "margin-top:12px" }, kpi));
}

function anomalyCard(type, f, extra) {
  return h("div", { class: "card anom" }, h("div", { class: "type", text: type }), badge(f.severity), h("div", { text: f.summary }), extra || null);
}
function renderAnomalies() {
  const A = I.anomalies, cards = [];
  A.dut_variance.forEach(f => cards.push(anomalyCard("DUT-specific variance", f, h("div", { class: "note", text: "Top signatures: " + f.top_signatures.map(x => `${x.signature} (${x.count})`).join(", ") }))));
  A.hardware_groups.forEach(f => cards.push(anomalyCard("Hardware group", f)));
  A.cross_talk.forEach(f => cards.push(anomalyCard("Feature cross-talk", f, f.feature_spikes[0] && f.feature_spikes[0].correlation != null ?
    h("div", { class: "note", text: `Correlation across builds: r = ${f.feature_spikes[0].correlation} (${f.feature_spikes[0].feature})` }) : null)));
  A.blocked_concentrations.forEach(f => cards.push(anomalyCard("Blocked concentration", f, h("div", { class: "note mono", text: "Gating tests: " + f.gating_tests.join(", ") }))));
  A.regressions.forEach(f => cards.push(anomalyCard("New regression", f)));
  A.coverage_gaps.forEach(f => cards.push(anomalyCard("Coverage blind spot", f)));
  return section("anomalies", "Anomalies & blind spots", `${A.count} findings (${A.high} high): hardware-dependent crashes, cross-feature degradation, gating bugs and untested gaps.`,
    h("div", { class: "grid g-3" }, cards.length ? cards : [card(null, null, "No anomalies flagged.")]));
}

function renderClusters() {
  const C = I.clusters, subs = C.subsystems;
  const impact = card("Root-cause buckets by firmware subsystem", "Impact = severity weight (Blocker 10, Critical 5, Medium 2, Trivial 1) + 0.2 × affected tests + crashes");
  hBars(impact, { aria: "Impact score by subsystem", labelWidth: 210, series: [{ name: "Impact", color: "var(--s1)" }], fmt: v => fmt(v, 1),
    rows: subs.map(x => ({ label: x.subsystem_name, values: [x.impact_score] })),
    tipRows: r => { const x = subs.find(y => y.subsystem_name === r.label); return [
      { value: fmt(x.impact_score, 1), label: "impact" }, { value: fmt(x.tickets), label: "tickets" },
      { value: `${x.severity.Blocker}/${x.severity.Critical}/${x.severity.Medium}/${x.severity.Trivial}`, label: "B/C/M/T" },
      { value: fmt(x.failed_tests), label: "failed tests" }, { value: fmt(x.blocked_tests), label: "blocked tests" }, { value: fmt(x.crash_occurrences), label: "crashes" }]; } });
  impact.append(details("Table view", tableView(["Subsystem", "Owner", "Tickets", "B/C/M/T", "Failed", "Blocked", "Crashes", "Top features"],
    subs.map(x => [x.subsystem_name, x.owner_team, x.tickets, `${x.severity.Blocker}/${x.severity.Critical}/${x.severity.Medium}/${x.severity.Trivial}`, x.failed_tests, x.blocked_tests, x.crash_occurrences, x.top_features.map(f => f[0]).join(", ")]), [2, 4, 5, 6])));
  const cs = C.crash_signatures;
  const crash = card("Crash signatures across all builds", `${cs.recurring} recurring vs ${cs.single_instance} single-instance; ${cs.active} still active, ${cs.resolved} resolved`,
    tableView(["Signature", "Jira", "Severity", "Status", "Type", "Total", "DUTs", "By build"], cs.signatures.map(x => [
      h("span", { class: "mono id", text: x.crash_signature }), h("span", { class: "mono id", text: x.jira_id }), badge(x.severity), badge(x.status),
      x.classification === "RECURRING" ? "Recurring" : "Single", fmt(x.total_occurrences), fmt(x.affected_duts.length),
      sparkColumns(D.builds.map(b => x.occurrences_by_build[b] || 0))]), [5, 6]));
  const fp = C.failure_persistence;
  const dups = card("Candidate duplicate tickets", `${C.duplicate_candidates.length} groups sharing subsystem and failure signature; ${fp.persistent_failures} tests failing ${fp.persistent_threshold_builds}+ builds in a row, ${fp.new_failures} new this build`,
    tableView(["Signature", "Subsystem", "Tickets", "Failed tests"], C.duplicate_candidates.map(d => [d.signature, d.subsystem, h("span", { class: "mono", text: d.tickets.join(", ") }), fmt(d.failed_tests)]), [3]));
  return section("clusters", "Semantic bug clustering", "Tickets grouped into root-cause buckets for the development teams.",
    h("div", { class: "grid g-2" }, impact, dups), h("div", { style: "margin-top:12px" }, crash));
}

function copyText(text, btn) {
  const done = () => { const o = btn.textContent; btn.textContent = "Copied"; setTimeout(() => btn.textContent = o, 1400); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = h("textarea", { style: "position:fixed;left:-9999px" }); ta.value = text; document.body.append(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) { /* ignore */ } ta.remove();
}

function renderActions() {
  const N = I.next_actions, n = D.narrative, teams = Object.keys(N.by_team);
  const list = h("div");
  const draw = team => list.replaceChildren(...N.actions.filter(a => team === "all" || a.team === team).map(a =>
    h("div", { class: "action" }, h("span", { class: "pill " + a.priority.toLowerCase(), text: a.priority }),
      h("div", null, h("div", { class: "team", text: `${a.team} · ${a.id}` }), h("div", { class: "what", text: a.action }), h("div", { class: "why", text: a.rationale })))));
  const sel = h("select", { "aria-label": "Filter actions by team", onchange: e => draw(e.target.value) },
    h("option", { value: "all", text: `All teams (${N.actions.length})` }), teams.map(t => h("option", { value: t, text: `${t} (${N.by_team[t].length})` })));
  draw("all");
  const actions = card(null, null, h("div", { class: "filters" }, h("span", { text: "Team" }), sel), list);
  const briefs = n && n.team_briefs ? card("Team briefs", n.source === "claude" ? "Written by Claude from the action list" : "From the action list",
    h("ul", { class: "bullets" }, n.team_briefs.map(b => h("li", null, h("b", { text: b.team + ": " }), b.brief)))) : null;
  const subsets = card("Targeted re-run subsets", "Run these instead of a full cycle to verify fixes. Each includes the ticket's failing and blocked tests plus the gating smoke tests of affected features.",
    tableView(["ID", "Purpose", "Tests", "MTBF DUTs", "KPIs", "Est. hours", "vs full cycle", ""], N.rerun_subsets.map(r => {
      const ids = [...r.tests.HCI_REGRESSION, ...r.tests.PHONE_TESTING];
      const btn = h("button", { type: "button", text: "Copy test IDs" }); btn.addEventListener("click", () => copyText(ids.join("\n"), btn));
      return [h("span", { class: "mono id", text: r.id }), r.purpose, fmt(r.test_count), r.mtbf_duts.length ? r.mtbf_duts.join(", ") : "—",
        r.kpi_metrics.length ? fmt(r.kpi_metrics.length) : "—", fmt(r.estimated_hours, 1), `−${fmt(r.savings_percent, 1)}%`, btn];
    }), [2, 5, 6]));
  return section("actions", "Next actions", "Prescriptive tasks by developer role, ordered by priority, with targeted re-run subsets instead of full-cycle executions.",
    h("div", { class: "grid g-2" }, actions, briefs || h("div")), h("div", { style: "margin-top:12px" }, subsets));
}

// ---------------------------------------------------------------- boot
function initTheme() {
  const root = document.documentElement, btn = document.getElementById("theme");
  let saved = null; try { saved = localStorage.getItem("bt-dash-theme"); } catch (e) { /* storage unavailable */ }
  if (saved === "light" || saved === "dark") root.dataset.theme = saved;
  const current = () => root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const label = () => btn.textContent = current() === "dark" ? "Light theme" : "Dark theme";
  label();
  btn.addEventListener("click", () => {
    root.dataset.theme = current() === "dark" ? "light" : "dark"; label();
    try { localStorage.setItem("bt-dash-theme", root.dataset.theme); } catch (e) { /* storage unavailable */ }
  });
}
initTheme();
renderMeta();
document.getElementById("app").append(renderTldr(), renderRelease(), renderTrends(), renderDomains(), renderAnomalies(), renderClusters(), renderActions());
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => charts.forEach(f => f()), 120); });
</script>
</body>
