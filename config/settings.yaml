# Bluetooth Test Infrastructure Dashboard Agent - pipeline configuration.
# Every number that shapes the generated data or the analysis lives here.

project:
  chipset_revision: BT_5_2_REV_C2
  bt_core_version: "5.2"

seeds:
  test_plan: 20261001   # one-time test plan generator
  test_runs: 20261020   # mock test run generator

paths:
  test_plan: data/test_plan.json
  runs_dir: data/runs
  validation_report: data/validation_report.json
  insights: data/insights.json

# ---------------------------------------------------------------------------
# Test plan (spec section 2.1)
# ---------------------------------------------------------------------------
test_plan:
  version: TP_BT52_2026.10_v1
  hci_regression:
    total_tests: 5000
    baseline_hours: 168        # 7 days
    parallel_lanes: 20         # test benches executing HCI suites in parallel
    suite_size: [8, 24]        # tests per sub-suite (first test is the gating setup test)
  phone_testing:
    total_tests: 1000
    baseline_hours: 24         # 1 day
    parallel_lanes: 8
    suite_size: [6, 16]
  mtbf:
    duts: 16
    planned_hours_per_dut: 120 # 5 x 24 h
  kpi_audio:
    baseline_hours: 72         # 3 days
    samples_per_metric: 40

# ---------------------------------------------------------------------------
# Mock test runs (spec section 3) - one full cycle per firmware build
# ---------------------------------------------------------------------------
runs:
  firmware_builds:
    - FW_v14.2.088
    - FW_v14.2.093
    - FW_v14.2.097
    - FW_v14.2.101
    - FW_v14.2.104
    - FW_v14.2.106_RC1
    - FW_v14.2.107_RC2
    - FW_v14.2.109_RC3
  last_cycle_start: "2026-10-13T00:00:00Z"
  cycle_cadence_days: 9        # a new cycle starts every 9 days

simulation:
  # Single-instance failures (one test, one Jira), interpolated first -> last build.
  background_failure_rate:
    HCI_REGRESSION: {first: 0.020, last: 0.006}
    PHONE_TESTING: {first: 0.035, last: 0.015}
  # Small multi-test defects auto-generated per build, interpolated first -> last build.
  minor_defects_per_build: {first: 18, last: 3}
  minor_defect_tests: [2, 9]
  minor_defect_lifetime_builds: [1, 3]
  minor_defect_severity: {Critical: 0.25, Medium: 0.65, Trivial: 0.10}
  singleton_severity: {Medium: 0.60, Trivial: 0.40}
  defect_fail_probability: 0.9 # chance an affected test fails in a build where the defect is active
  passed_on_retry_rate:
    HCI_REGRESSION: 0.004
    PHONE_TESTING: 0.015       # "retry on transience"
  retries:
    HCI_REGRESSION: {max_retries: 2, diagnostic_log_minutes: 15}
    PHONE_TESTING: {max_retries: 1, diagnostic_log_minutes: 5}
  isolation_suite:
    fail_rate_threshold: 0.06  # a feature above this failure rate triggers a dynamic isolation suite
    hours: 1.0
  mtbf:
    auto_recovery_minutes: [4, 12]
    manual_recovery_minutes: [45, 180]
  kpi:
    remeasure_hours_per_breach: 4
    degraded_margin: 0.15      # missing target by <= 15% is DEGRADED, beyond that FAIL

# ---------------------------------------------------------------------------
# Release gates (used by the analysis engine, Step 5)
# ---------------------------------------------------------------------------
release:
  target_offset_days: 21       # target release date = last run end + 21 days
  gates:
    max_open_blockers: 0
    max_open_criticals: 5
    min_pass_rate_percent: 98.0
    min_mtbf_hours: 200
    all_kpis_pass: true

# ---------------------------------------------------------------------------
# Analysis engine (Step 5)
# ---------------------------------------------------------------------------
analysis:
  health_index:
    weights: {pass_rate: 0.40, defects: 0.25, mtbf: 0.20, kpi: 0.15}
    pass_rate_floor: 90          # pass rate at or below this scores 0; 100% scores 100
    defect_penalty: {Blocker: 20, Critical: 5, Medium: 0.5, Trivial: 0.1}  # points per open ticket
    bands: {green: 85, amber: 70}  # >= green GREEN, >= amber AMBER, else RED
  slippage:
    fix_days: {Blocker: 5, Critical: 3, Medium: 1.5, Trivial: 0.5}  # per ticket, serial within a subsystem team
    triage_hours_per_failure: 0.5
    triage_capacity_hours_per_day: 48   # 6 engineers x 8 h
    burn_down_window_builds: 3          # builds used to measure failure burn-down velocity
    at_risk_slip_days: 7                # slip <= 0 ON_TRACK, <= 7 AT_RISK, else OFF_TRACK
  anomalies:
    dut_outlier_ratio: 2.0       # DUT crashes vs fleet median ...
    dut_outlier_z: 2.0           # ... and z-score, both required
    group_ratio: 1.5             # hardware group crash rate vs rest of fleet
    kpi_step_sigma: 3            # KPI build-to-build change beyond 3 std devs is a step
    feature_spike_ratio: 1.4     # feature failures up >= 40% ...
    feature_spike_min: 5         # ... and by >= 5 tests
    blocked_concentration_min: 10
    blocked_feature_share: 0.05  # >= 5% of a feature blocked is a coverage gap
    persistent_blocked_builds: 3
  clustering:
    persistent_failure_builds: 3
  rerun:
    mtbf_soak_hours: 24          # targeted MTBF soak on affected DUTs
    kpi_remeasure_hours: 4       # per metric
